name: Build AUTO BTĐ v1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem source_chunks\part*.txt | Sort-Object Name
          if ($parts.Count -eq 0) { throw 'source chunks missing' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('AUTO_BTD_v1.0_source.tar.xz', [Convert]::FromBase64String($b64))
          if (Test-Path work) { Remove-Item work -Recurse -Force }
          New-Item -ItemType Directory -Force work | Out-Null
          tar -xJf AUTO_BTD_v1.0_source.tar.xz -C work

      - name: Verify source contract
        shell: pwsh
        run: python work\tools\verify_btd_v1.py

      - name: Configure x64
        run: cmake -S work -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --target AutoBTD ThanLongCleanRouteBridge route_logic_tests unity_geometry_logic_tests internal_ui_click_logic_tests travel_fight_guard_logic_tests auto_fight_retry_logic_tests travel_network_logic_tests

      - name: Run retained-core tests
        shell: pwsh
        run: |
          $tests = @('route_logic_tests','unity_geometry_logic_tests','internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests','travel_network_logic_tests')
          foreach ($t in $tests) {
            & ".\build\Release\$t.exe"
            if ($LASTEXITCODE -ne 0) { throw "$t failed: $LASTEXITCODE" }
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\AUTO_BTD_v1.0.exe dist\AUTO_BTD_v1.0.exe
          Copy-Item build\Release\ThanLongCleanRouteBridge.dll dist\ThanLongCleanRouteBridge.dll
          Compress-Archive -Force -Path work\* -DestinationPath dist\AUTO_BTD_v1.0_source.zip
          Compress-Archive -Force -Path dist\AUTO_BTD_v1.0.exe,dist\ThanLongCleanRouteBridge.dll -DestinationPath dist\AUTO_BTD_v1.0_Windows_x64.zip
          Get-ChildItem dist -File | ForEach-Object { $h = Get-FileHash $_.FullName -Algorithm SHA256; "$($_.Name)  $($h.Hash)" } | Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AUTO_BTD_v1.0_Windows_x64
          path: dist/*

      - name: Publish binaries/source to repo
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "build: publish AUTO BTĐ v1.0 [skip ci]"
          git push
