name: Build AUTO BTĐ v1.1

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: pwsh
        run: |
          $ordered = @()
          0..12 | ForEach-Object { $ordered += ("source_chunks\\part{0:D3}.txt" -f $_) }
          $ordered += 'source_chunks\part013.txt'
          $ordered += 'source_chunks\part013_tail.txt'
          14..20 | ForEach-Object { $ordered += ("source_chunks\\part{0:D3}.txt" -f $_) }
          $ordered += 'source_chunks\part021_fix_a.txt'
          $ordered += 'source_chunks\part021_fix_b.txt'
          22..25 | ForEach-Object { $ordered += ("source_chunks\\part{0:D3}.txt" -f $_) }

          foreach ($p in $ordered) {
            if (-not (Test-Path $p)) { throw "source chunk missing: $p" }
          }

          Write-Host "Reconstructing from $($ordered.Count) ordered chunks"
          $b64 = ($ordered | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('AUTO_BTD_v1.1_source.tar.xz', [Convert]::FromBase64String($b64))

          $expected = 'ee628cd44fd4c3d1e53de657bddc7059b132a19b3458a02ab144f7bdedaa7090'
          $actual = (Get-FileHash 'AUTO_BTD_v1.1_source.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source SHA256: $actual"
          if ($actual -ne $expected) { throw "source archive SHA256 mismatch: $actual" }

      - name: Extract source archive
        shell: pwsh
        run: |
          if (Test-Path work) { Remove-Item work -Recurse -Force }
          New-Item -ItemType Directory -Force work | Out-Null
          python -c "import tarfile; t=tarfile.open(r'AUTO_BTD_v1.1_source.tar.xz','r:xz'); t.extractall(r'work'); t.close(); print('source extracted')"
          if ($LASTEXITCODE -ne 0) { throw "source extraction failed: $LASTEXITCODE" }

      - name: Verify source contract
        shell: pwsh
        run: python work\tools\verify_btd_v1.py

      - name: Configure x64
        run: cmake -S work -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --target AutoBTD ThanLongCleanRouteBridge route_logic_tests unity_geometry_logic_tests internal_ui_click_logic_tests travel_fight_guard_logic_tests auto_fight_retry_logic_tests travel_network_logic_tests

      - name: Run retained-core tests
        shell: pwsh
        run: |
          $tests = @('route_logic_tests','unity_geometry_logic_tests','internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests','travel_network_logic_tests')
          foreach ($t in $tests) {
            & ".\build\Release\$t.exe"
            if ($LASTEXITCODE -ne 0) { throw "$t failed: $LASTEXITCODE" }
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\AUTO_BTD_v1.1.exe dist\AUTO_BTD_v1.1.exe
          Copy-Item build\Release\ThanLongCleanRouteBridge.dll dist\ThanLongCleanRouteBridge.dll
          Compress-Archive -Force -Path work\* -DestinationPath dist\AUTO_BTD_v1.1_source.zip
          Compress-Archive -Force -Path dist\AUTO_BTD_v1.1.exe,dist\ThanLongCleanRouteBridge.dll -DestinationPath dist\AUTO_BTD_v1.1_Windows_x64.zip
          Get-ChildItem dist -File | ForEach-Object { $h = Get-FileHash $_.FullName -Algorithm SHA256; "$($_.Name)  $($h.Hash)" } | Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AUTO_BTD_v1.1_Windows_x64
          path: dist/*

      - name: Publish binaries/source to repo
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "build: publish AUTO BTĐ v1.1 [skip ci]"
          git push
