name: Cancel stuck AUTO BTĐ v1.1 build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cancel-stuck-v11.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stuck-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck run 33873959017
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/33873959017/cancel")
          cat response.txt || true
          echo "HTTP $code"
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            exit 1
          fi
